<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
    />
  </head>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Anton&family=Playwrite+NZ:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");

    :root {
      --orange-color: #ee5007;
      --white-color: white;
      --black-color: black;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Poppins", sans-serif;
    }
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      color: white;
    }

    .bg-video {
      position: absolute;
      top: 0;
      left: 0;
      filter: brightness(40%);
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    header {
      display: flex;
      justify-content: center;
      width: 100%;
      height: 12%;
    }
    nav {
      width: 90%;
      height: 13vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0px 20px;
    }
    ul {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }
    li {
      list-style: none;
    }
    header nav a {
      text-decoration: none;
      color: var(--white-color);
    }
    header nav a i {
      font-size: 35px;
      transition: 0.3s;
    }
    header li a {
      text-decoration: none;
      color: var(--white-color);
      padding: 10px;
      transition: 0.3s;
    }
    header li a:hover,
    header nav a i:hover,
    header li a.active {
      color: var(--orange-color);
    }
    .hero {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .hero p {
      margin-bottom: 15px;
    }
    .hero h1 {
      font-size: 50px;
      margin-bottom: 15px;
    }
    .hero button {
      padding: 10px 25px;
      border-radius: 20px;
      border: none;
      background-color: var(--orange-color);
      margin-top: 10px;
    }
    .hero button a {
      text-decoration: none;
      color: var(--white-color);
    }
    .hero button:hover {
      background-color: #ae3c06;
    }
    .instruction {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      height: 20vh;
    }
    .clock {
      display: flex;
    }
    .location {
      display: flex;
    }
    .share {
      display: flex;
    }
    .instruction i {
      color: var(--orange-color);
    }
    .clock i,
    .location i {
      text-align: center;
      margin-right: 10px;
      font-size: 30px;
    }
    .share i {
      font-size: 25px;
      text-align: center;
      margin-left: 5px;
      padding-top: 10px;
    }
  </style>
  <body>
    <section class="hero">
      <video class="bg-video" autoplay muted loop playsinline>
        <source src="djclub.mp4" type="video/mp4" />
      </video>

      <header>
        <nav>
          <a href=""><i class="ri-disc-line"></i></a>
          <ul>
            <li><a href="index.html" class="nav-link active">Home</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
            <li><a href="artists_photo.html" class="nav-link">Artists</a></li>
          </ul>
        </nav>
      </header>

      <div class="hero">
        <p>Festival Live Present</p>
        <h1>Night Light 2024</h1>
        <button><a href="about.html">Let's begin</a></button>
      </div>

      <div class="instruction">
        <div class="clock">
          <i class="ri-time-line"></i>
          <h2>10 - 12th, Dec 2024</h2>
        </div>
        <div class="location">
          <i class="ri-map-pin-2-line"></i>
          <h2>Pyi Thuu Yin Pyin, Yangon</h2>
        </div>
        <div class="share">
          <h3>Share:</h3>
          <div class="icon">
            <i class="ri-facebook-circle-fill"></i>
            <i class="ri-tiktok-fill"></i>
            <i class="ri-instagram-line"></i>
          </div>
        </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
